name: CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "release/**"
      - "hotfix/**"
  pull_request:

jobs:
  test:
    name: "${{ matrix.os }} • Swift ${{ matrix.swift }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        swift: ["6.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: swift test --parallel

  build-apple-platforms:
    name: Build (${{ matrix.name }})
    # visionOS development requires Apple silicon. GitHub's macos-15 image is ARM64.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
            download_platform: ''
          - name: Mac Catalyst
            destination: generic/platform=macOS,variant=Mac Catalyst
            download_platform: ''
          - name: tvOS
            destination: generic/platform=tvOS
            download_platform: tvOS
          - name: watchOS
            destination: generic/platform=watchOS
            download_platform: watchOS
          - name: visionOS
            destination: generic/platform=visionOS
            download_platform: visionOS

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Xcode version
        run: xcodebuild -version

      - name: Install platform support
        if: matrix.download_platform != ''
        run: xcodebuild -downloadPlatform '${{ matrix.download_platform }}'

      - name: Build
        run: >-
          xcodebuild build
          -scheme XCERequirement
          -destination '${{ matrix.destination }}'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
